version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    # dbt-core, dbt-duckdb, duckdb and pyiceberg move together; bump them deliberately.
    ignore:
      - dependency-name: dbt-core
      - dependency-name: dbt-duckdb
      - dependency-name: duckdb
      - dependency-name: pyiceberg
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /infra/envs/dev
    schedule:
      interval: weekly

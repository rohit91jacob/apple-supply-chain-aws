name: apple_supply_chain
version: "0.1.0"
config-version: 2
profile: apple_supply_chain

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: target
clean-targets: ["target", "dbt_packages", "logs"]

flags:
  send_anonymous_usage_stats: false

vars:
  # Fiscal years before FY2013 used other product/segment schemes (see docs/data_dictionary.md)
  first_mix_fiscal_year: 2013

models:
  apple_supply_chain:
    +persist_docs: {relation: true, columns: true}
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
      # On Athena every mart is an Iceberg table registered in the Glue Data Catalog.
      +table_type: "{{ 'iceberg' if target.type == 'athena' else none }}"
      +format: "{{ 'parquet' if target.type == 'athena' else none }}"
